<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        #perfil-configuracao .ssp-password-wrapper {
            position: relative !important;
            display: block !important;
            width: 100% !important;
        }

        #perfil-configuracao .ssp-password-wrapper input {
            display: block !important;
            width: 100% !important;
            box-sizing: border-box !important;
            padding-right: 46px !important;
        }

        #perfil-configuracao .ssp-password-wrapper .ssp-toggle-password {
            position: absolute !important;
            top: 50% !important;
            right: 12px !important;
            transform: translateY(-50%) !important;
            background: none !important;
            border: none !important;
            padding: 4px !important;
            cursor: pointer !important;
            color: #6b7280 !important;
            font-size: 1.1rem !important;
        }

        #perfil-configuracao .ssp-password-wrapper .ssp-toggle-password:hover {
            color: #1f2937 !important;
        }
    </style>
    <script th:src="@{/js/toggle-senha.js}" defer></script>
    <title th:text="${tituloPagina}">Perfil</title>
</head>
<body class="body-perfil">
<div class="mobile-header">
    <button type="button" class="btn-toggle-sidebar" id="btnToggleSidebar" aria-label="Abrir Menu">
        <i class="fa-solid fa-bars"></i>
        <span>Menu do Perfil</span>
    </button>
</div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="painel-controle">
    <div class="container-painel">
        <!-- MENU LATERAL -->
        <div class="sidebar" id="sidebarMenu">
            <div class="sidebar-header">
                <h3 class="bar-item">Painel</h3>
                <button type="button" class="btn-close-sidebar" id="btnCloseSidebar" aria-label="Fechar Menu">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <a th:href="@{/perfil(aba='informacao')}" class="bar-item button" th:classappend="${abaAtiva == 'informacao'} ? 'active'">Informação do Perfil</a>
            <a th:href="@{/perfil(aba='configuracao')}" class="bar-item button" th:classappend="${abaAtiva == 'configuracao'} ? 'active'">Configuração do Perfil</a>
            <a th:href="@{/perfil(aba='agendamento')}" class="bar-item button" th:classappend="${abaAtiva == 'agendamento'} ? 'active'">Agendamentos</a>
            <a th:href="@{/perfil(aba='depoimento')}" class="bar-item button" th:classappend="${abaAtiva == 'depoimento'} ? 'active'">Depoimentos</a>
            <a th:href="@{/}" class="bar-item button">Voltar</a>
        </div>
    </div>

    <div class="conteudo-principal">

        <!-- ABA: INFORMAÇÃO DO PERFIL -->
        <section id="perfil-informacao" class="secao-painel" th:if="${abaAtiva == 'informacao'}">
            <div class="secao-header">
                <h2>Informação do Perfil</h2>
            </div>

            <form class="form-perfil" th:action="@{/perfil/atualizar-perfil}" th:object="${usuarioDTO}" method="POST">
                <div class="group-info success" th:if="${mensagemSucesso}">
                    <span th:text="${mensagemSucesso}"></span>
                </div>
                <div class="group-info error" th:if="${mensagemError}">
                    <span th:text="${mensagemError}"></span>
                </div>
                <div class="form-grid">
                    <div class="group-input">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" name="nome" th:field="*{nomeCompleto}" readonly>
                    </div>
                    <div class="group-input">
                        <label for="data_nascimento">Data de Nascimento</label>
                        <input type="text" id="data_nascimento" th:field="*{dataNascimento}" maxlength="10" placeholder="dd/mm/aaaa">
                    </div>
                    <div class="group-input">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" name="telefone" th:field="*{telefone}" maxlength="15">
                    </div>
                    <div class="group-input">
                        <label for="email">E-mail</label>
                        <input type="text" id="email" name="email" th:field="*{email}" readonly>
                    </div>
                    <div class="group-input"></div>
                    <div class="group-button">
                        <button type="submit" class="btn">Salvar</button>
                    </div>
                </div>
            </form>
        </section>

        <!-- ABA: CONFIGURAÇÃO DO PERFIL -->
        <section id="perfil-configuracao" class="secao-painel" th:if="${abaAtiva == 'configuracao'}">
            <div class="secao-header">
                <h2>Configuração do Perfil</h2>
            </div>

            <form class="form-perfil" th:action="@{/perfil/atualizar-senha}" th:object="${usuarioDTO}" method="POST">
                <h3>Atualizar Senha</h3>

                <div class="group-info success" th:if="${mensagemSucesso}">
                    <span th:text="${mensagemSucesso}"></span>
                </div>
                <div class="group-info error" th:if="${mensagemError}">
                    <span th:text="${mensagemError}"></span>
                </div>

                <div class="group-input">
                    <label for="senha-atual">Senha Atual</label>
                    <input th:field="*{senha}" type="password" id="senha-atual">
                </div>

                <div class="group-input">
                    <label for="senha-nova">Nova Senha</label>
                    <div class="ssp-password-wrapper">
                        <input th:field="*{novaSenha}" type="password" id="senha-nova" autocomplete="new-password">
                        <button type="button" class="ssp-toggle-password" aria-label="Mostrar ou ocultar senha"
                                onclick="togglePasswordVisibility('senha-nova', 'eyeIconNova')">
                            <i class="fa-solid fa-eye" id="eyeIconNova"></i>
                        </button>
                    </div>
                </div>

                <div class="group-input">
                    <label for="senha-confirmar">Confirmar Nova Senha</label>
                    <div class="ssp-password-wrapper">
                        <input th:field="*{confirmacaoSenha}" type="password" id="senha-confirmar" autocomplete="new-password">
                        <button type="button" class="ssp-toggle-password" aria-label="Mostrar ou ocultar senha"
                                onclick="togglePasswordVisibility('senha-confirmar', 'eyeIconConfirmar')">
                            <i class="fa-solid fa-eye" id="eyeIconConfirmar"></i>
                        </button>
                    </div>
                </div>

                <div class="group-button">
                    <button type="submit" class="btn">Atualizar Senha</button>
                </div>
            </form>
        </section>

        <!-- ABA: AGENDAMENTOS -->
        <section id="perfil-agendamento" class="secao-painel" th:if="${abaAtiva == 'agendamento'}">
            <div class="secao-header">
                <h2>Meus Agendamentos</h2>
            </div>

            <!-- Mensagem se não houver registros -->
            <div th:if="${paginaAgendamentos.empty}" class="sem-agendamentos">
                <p>Nenhum agendamento encontrado.</p>
            </div>

            <!-- Lista de Cards -->
            <div class="lista-agendamentos" th:if="${!paginaAgendamentos.empty}">

                <div class="card-agendamento" th:each="agendamento : ${paginaAgendamentos.content}">

                    <div class="card-agendamento-imagem"
                         th:style="'background-image: url(\'' + ${agendamento.imagemAnexo} + '\');'">
                    </div>

                    <div class="card-agendamento-corpo">
                        <!-- Status com classe CSS dinâmica -->
                        <div th:class="'card-agendamento-status ' + ${agendamento.statusClasseCss}"
                             th:text="${agendamento.statusTexto}">
                            Concluído
                        </div>

                        <h3 class="card-agendamento-titulo" th:text="${agendamento.nomeServico}">Corte de Cabelo</h3>

                        <div class="card-agendamento-info">
                <span>
                    <i class="fa-solid fa-location-dot"></i>
                    <span th:text="${agendamento.nomeUnidade}">Unidade SENAC</span>
                </span>
                            <span>
                    <i class="fa-regular fa-clock"></i>
                    Duração: <span th:text="${agendamento.duracaoMinutos}">45 min</span>
                </span>
                            <span>
                    <i class="fa-solid fa-calendar-days"></i>
                    <span th:text="${#temporals.format(agendamento.dataAgendamento, 'dd/MM/yyyy')}">12/08/2026</span>
                </span>
                            <span>
                    <i class="fa-regular fa-clock"></i>
                    <span th:text="${#temporals.format(agendamento.horaInicio, 'HH:mm')}">14:30</span>
                </span>
                        </div>
                    </div>

                </div>

            </div>

            <!-- Controles de Paginação do Painel Lateral -->
            <div class="paginacao-painel" th:if="${paginaAgendamentos.totalPages > 1}">
                <a th:href="@{/perfil(pagina=${paginaAgendamentos.number - 1})}"
                   th:classappend="${paginaAgendamentos.first} ? 'disabled' : ''"
                   class="btn-paginacao-aba">
                    <i class="fa-solid fa-chevron-left"></i>
                </a>

                <span><strong th:text="${paginaAgendamentos.number + 1}">1</strong> / <span th:text="${paginaAgendamentos.totalPages}">3</span></span>

                <a th:href="@{/perfil(pagina=${paginaAgendamentos.number + 1})}"
                   th:classappend="${paginaAgendamentos.last} ? 'disabled' : ''"
                   class="btn-paginacao-aba">
                    <i class="fa-solid fa-chevron-right"></i>
                </a>
            </div>
        </section>

        <!-- ABA: DEPOIMENTOS -->
        <section id="perfil-depoimento" class="secao-painel" th:if="${abaAtiva == 'depoimento'}">
            <div class="secao-header">
                <h2>Depoimentos</h2>
            </div>

            <form class="form-perfil" th:action="@{/perfil/enviar-depoimento}" method="POST" enctype="multipart/form-data">
                <div class="group-info success" th:if="${mensagemSucesso}">
                    <span th:text="${mensagemSucesso}"></span>
                </div>
                <div class="group-info error" th:if="${mensagemError}">
                    <span th:text="${mensagemError}"></span>
                </div>

                <!-- SELEÇÃO DO AGENDAMENTO CONCLUÍDO -->
                <div class="group-input">
                    <label for="idAgendamento">Selecione o Agendamento Concluído</label>

                    <select id="idAgendamento" name="idAgendamento" required th:if="${listaAgendamentosRealizados != null and !#lists.isEmpty(listaAgendamentosRealizados)}">
                        <option value="" disabled th:selected="${agendamentoIdSelecionado == null}">Selecione um agendamento...</option>
                        <option th:each="ag : ${listaAgendamentosRealizados}"
                                th:value="${ag.id}"
                                th:text="${(ag.disponibilidade?.produtoUnidade?.produto?.nomeProduto != null ? ag.disponibilidade.produtoUnidade.produto.nomeProduto : 'Agendamento #' + ag.id) + ' - ' + (ag.dataHoraAgendamento != null ? #temporals.format(ag.dataHoraAgendamento, 'dd/MM/yyyy HH:mm') : '')}"
                                th:selected="${ag.id == agendamentoIdSelecionado}">
                            Serviço Exemplo
                        </option>
                    </select>

                    <select id="idAgendamentoVazio" disabled th:if="${listaAgendamentosRealizados == null or #lists.isEmpty(listaAgendamentosRealizados)}">
                        <option selected>Nenhum serviço concluído disponível para avaliação</option>
                    </select>
                </div>

                <!-- TEXTO DO DEPOIMENTO -->
                <div class="group-input">
                    <label for="depoimento">Seu Depoimento</label>
                    <textarea id="depoimento" name="depoimento" rows="4" placeholder="Escreva aqui seu depoimento..." th:text="${comentarioTexto}" required></textarea>
                </div>

                <!-- ANEXAR IMAGEM E PRÉ-VISUALIZAÇÃO VIA BACKEND -->
                <div class="group-input">
                    <label for="imagem">Adicionar Imagens</label>

                    <!-- INPUT COM MULTIPLE E NAME="IMAGENS" -->
                    <input type="file" id="imagem" name="imagens" accept="image/*" multiple
                           onchange="this.form.action='/perfil/enviar-depoimento?acao=preview'; this.form.submit();">

                    <!-- RENDERIZAÇÃO DA LISTA DE IMAGENS EM PREVIEW -->
                    <div class="container-preview-lista" th:if="${listaPreviewBase64 != null and !#lists.isEmpty(listaPreviewBase64)}">
                        <div class="container-preview-imagem" th:each="imgBase64, iter : ${listaPreviewBase64}">
                            <img th:src="'data:' + ${listaPreviewTipos[iter.index]} + ';base64,' + ${imgBase64}"
                                 alt="Pré-visualização da imagem">
                        </div>
                    </div>
                </div>

                <div class="group-button">
                    <button type="submit" name="acao" value="salvar" class="btn">Enviar Depoimento</button>
                </div>
            </form>
        </section>

    </div>
</div>
<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
