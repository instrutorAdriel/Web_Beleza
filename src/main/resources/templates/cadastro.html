<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon-senac.svg}">
    <title th:text="${tituloPagina}">Criar Conta</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <script th:src="@{/js/cadastro.js}" defer></script>
</head>
<body class="ssp-page">

<div class="ssp-logo-fixed-container">
    <img src="/img/branca_senac.png" alt="Logo SENAC" class="ssp-logo-senac">
</div>

<main class="ssp-login-centered-container">
    <div class="ssp-form-card cadastro-container">

        <header class="ssp-header-page-login">
            <a class="ssp-login-button-back" th:href="@{/login}">&larr; Voltar para o Login</a>
            <h1 th:text="${tituloPagina}">Criar Conta</h1>
            <p class="ssp-register-footer ssp-text-left-top">
                Preencha os dados abaixo para se cadastrar.
            </p>
        </header>

        <div th:if="${erro != null and campoErro == null}" class="ssp-form-control input-error ssp-status-box ssp-error-box">
            <span class="ssp-error-message ssp-message-display" th:text="${erro}">Erro encontrado</span>
        </div>

        <form id="kc-form-register" th:action="@{/cadastro}" th:object="${usuarioDTO}" method="POST" novalidate>

            <div class="ssp-form-group">
                <label th:for="nomeCompleto">Nome Completo</label>
                <input type="text"
                       th:field="*{nomeCompleto}"
                       id="nomeCompleto"
                       class="ssp-form-control"
                       th:classappend="${campoErro == 'nomeCompleto'} ? 'input-error'"
                       placeholder="Digite seu nome completo" required>
                <small id="nomeCompleto-erro"
                       class="ssp-aviso-erro"
                       th:style="${campoErro == 'nomeCompleto'} ? 'display: flex;' : 'display: none;'">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span th:text="${campoErro == 'nomeCompleto'} ? ${erro} : 'Informe seu nome completo (apenas letras).'"></span>
                </small>
            </div>
            <div class="ssp-form-row">
                <div class="ssp-form-group ssp-flex-1">
                    <label th:for="dataNascimento">Data de Nascimento</label>
                    <input type="date"
                    th:field="*{dataNascimento}"
                    id="data_nascimento"
                    class="ssp-form-control"
                    th:classappend="${campoErro == 'dataNascimento'} ? 'input-error'"
                    min="1900-01-01"
                    required>
                    <small id="data_nascimento-erro" class="ssp-aviso-erro"
                    th:style="${campoErro == 'dataNascimento'} ? 'display: flex;' : 'display: none;'">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        <span th:text="${campoErro == 'dataNascimento'} ? ${erro} : ''"></span>
                    </small>
                </div>
                <div class="ssp-form-group ssp-flex-1">
                    <label th:for="telefone">Telefone</label>
                    <input type="tel"
                           th:field="*{telefone}"
                           id="telefone"
                           class="ssp-form-control"
                           th:classappend="${campoErro == 'telefone'} ? 'input-error'"
                           placeholder="(00) 00000-0000"
                           maxlength="15" required>
                    <small id="telefone-erro" class="ssp-aviso-erro"
                    th:style="${campoErro == 'telefone'} ? 'display: flex;' : 'display: none;'">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        <span th:text="${campoErro == 'telefone'} ? ${erro} : ''"></span>
                    </small>
                </div>
            </div>

            <div id="alertaIdade" class="ssp-alert" style="display:none;"></div>

            <div class="ssp-form-group">
                <label th:for="email">E-mail</label>
                <input type="email" th:field="*{email}" id="email" class="ssp-form-control"
                       th:classappend="${campoErro == 'email'} ? 'input-error'"
                       placeholder="Ex: seuemail@provedor.com" required autocomplete="email">
                <small id="email-erro" class="ssp-aviso-erro"
                       th:style="${campoErro == 'email'} ? 'display: flex;' : 'display: none;'">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span th:text="${campoErro == 'email'} ? ${erro} : ''"></span>
                </small>
            </div>

            <div class="ssp-form-group">
                <label th:for="senha">Senha</label>
                <div class="ssp-password-wrapper">
                    <input type="password" th:field="*{senha}" id="password" class="ssp-form-control"
                           th:classappend="${campoErro == 'senha'} ? 'input-error'"
                           placeholder="Mín. 8 caracteres (letra, número e símbolo)" minlength="8" maxlength="25" required autocomplete="new-password">
                    <button type="button" class="ssp-toggle-password" onclick="togglePasswordVisibility('password', 'eyeIcon1')">
                        <i class="fa-solid fa-eye" id="eyeIcon1"></i>
                    </button>
                </div>

                <small id="password-erro" class="ssp-aviso-erro"
                       th:style="${campoErro == 'senha'} ? 'display: flex;' : 'display: none;'">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span th:text="${campoErro == 'senha'} ? ${erro} : ''"></span>
                </small>
            </div>

            <div class="ssp-form-group">
                <label th:for="confirmacaoSenha">Confirmar Senha</label>
                <div class="ssp-password-wrapper">
                    <input type="password" th:field="*{confirmacaoSenha}" id="confirm-password"
                           class="ssp-form-control"
                           th:classappend="${campoErro == 'confirmacaoSenha'} ? 'input-error'"
                           placeholder="Repita a senha criada"
                           minlength="8" maxlength="25" required autocomplete="new-password">
                    <button type="button" class="ssp-toggle-password" onclick="togglePasswordVisibility('confirm-password', 'eyeIcon2')">
                        <i class="fa-solid fa-eye" id="eyeIcon2"></i>
                    </button>
                </div>
                <small id="confirm-password-erro" class="ssp-aviso-erro"
                       th:style="${campoErro == 'confirmacaoSenha'} ? 'display: flex;' : 'display: none;'">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span th:text="${campoErro == 'confirmacaoSenha'} ? ${erro} : ''"></span>
                </small>
            </div>

            <button type="submit" id="btnSubmitCadastro" class="ssp-btn-submit ssp-mt-1">Finalizar Cadastro</button>

        </form>

        <div class="ssp-register-footer ssp-text-center-mt">
            Já tem uma conta? <a th:href="@{/login}">Faça login aqui</a>
        </div>

    </div>
</main>

</body>
</html>
